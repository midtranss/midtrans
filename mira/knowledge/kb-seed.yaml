    never_say: [which method is cheaper, rates, sailing dates, space availability, that a vehicle may be imported]

  - id: kb-014
    topic: food-import-syria
    question:
      en: What is required to import food, confectionery or beverages into Syria?
      ar: ما المطلوب لاستيراد المواد الغذائية والحلويات والمشروبات إلى سوريا؟
    answer:
      en: >
        DRAFT — MUST BE COMPLETED BY MIDTRANS OPERATIONS. Food is a regulated category: health
        certificates, shelf-life rules, labelling and product registration all apply, and they
        differ from the general import case in kb-003. This entry stays unserved until operations
        writes what is actually required, who issues each document, and which parts change by
        product type. A first-time food importer acting on a guessed list loses the consignment,
        not an argument.
      ar: >
        مسوّدة — يجب أن يكملها فريق عمليات ميدترانس. المواد الغذائية فئة منظَّمة: شهادات صحّية،
        وقواعد صلاحية، ووسم، وتسجيل منتجات — وكلّها تختلف عن حالة الاستيراد العامة في kb-003.
        يبقى هذا المُدخَل غير مُقدَّم حتى يكتب الفريق ما هو مطلوب فعلاً، ومن يُصدر كل وثيقة، وأي
        الأجزاء يتغيّر بتغيّر نوع المنتج. المستورد الأول الذي يتصرّف بقائمة مُخمَّنة يخسر الشحنة،
        لا النقاش.
    source: REQUIRED — MIDTRANS operations knowledge capture. Asked in enquiry 2026-09-15-fmcg-jebelali, sixteen questions of which several were regulatory.
