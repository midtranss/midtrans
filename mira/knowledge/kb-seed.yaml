# MIRA knowledge base — seed set
#
# Questions sourced from real MIDTRANS enquiries (docs/baseline/D3-rfq-analysis.md §6).
# Answers are DRAFT and must be reviewed by MIDTRANS operations before being served.
#
# Schema per entry:
#   id, question (en/ar), answer (en/ar), source, owner, reviewed_at, expires_at,
#   status: draft | approved | retired
#   escalate_if: conditions that must route to a human instead of answering
#   never_say: category reminders for this specific topic

meta:
  version: 0.1
  created: 2026-09-16
  status: draft
  review_required_by: MIDTRANS operations
  note: >
    No entry may be served while status is draft. Answers were drafted from observable
    mailbox evidence and general trade practice, not from MIDTRANS's documented procedure.
    kb-011 to kb-016 were added on 2026-09-16 from the six-month mailbox sweep
    (docs/baseline/D3-rfq-analysis.md §8c); each cites the register id of the enquiry that
    asked it, never the enquirer. Eight of the sixteen are deliberately unanswered because
