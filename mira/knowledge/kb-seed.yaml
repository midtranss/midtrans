      ar: هل تتولّون التخليص الجمركي في اللاذقية أو طرطوس، وماذا يتضمّن ذلك؟
    answer:
      en: >
        DRAFT — THIS IS MIDTRANS'S STRONGEST SUBJECT AND MUST COME FROM OPERATIONS. MIDTRANS has
        worked through these ports since 1998. That experience is the content moat Phase 04 is
        built on, and it cannot be drafted from outside. Operations should describe the actual
        sequence, the documents genuinely required, and where shipments most commonly get delayed.
      ar: >
        مسوّدة — هذا أقوى موضوع لدى ميدترانس، ويجب أن يأتي من فريق العمليات. تعمل الشركة عبر هذين
        المرفأين منذ ١٩٩٨، وتلك الخبرة هي الحصن المعرفي الذي تقوم عليه المرحلة الرابعة، ولا يمكن
        صياغتها من الخارج. على الفريق أن يصف التسلسل الفعلي، والوثائق المطلوبة حقاً، وأين تتأخّر
