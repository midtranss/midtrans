entries:

  - id: kb-001
    topic: china-syria-lcl
    question:
      en: Do you do LCL from China to Syria, and how does consolidation work?
      ar: هل تقومون بالشحن الجزئي LCL من الصين إلى سوريا، وكيف يعمل التجميع؟
    answer:
      en: >
        Yes — LCL means your cargo shares a container with other shippers' goods. It is collected
        at a consolidation warehouse at origin, loaded with other cargo, then separated again at
        destination. It suits shipments too small to justify a full container, which is most first
        orders. What you need to prepare: the commodity description, the gross weight, the volume
        in CBM or the carton dimensions, and whether your supplier delivers to the warehouse or we
        collect. Tell me those and I will put it in front of our team.
      ar: >
        نعم — الشحن الجزئي يعني أن بضاعتك تتشارك الحاوية مع بضائع شاحنين آخرين. تُجمَّع في مستودع
        تجميع في بلد المنشأ، وتُحمَّل مع غيرها، ثم تُفصَل في الوجهة. وهو مناسب للشحنات الأصغر من أن
        تبرّر حاوية كاملة، وهذه حال معظم الطلبيات الأولى. ما تحتاج تجهيزه: وصف البضاعة، والوزن
        الإجمالي، والحجم بالمتر المكعب أو أبعاد الكراتين، وهل يسلّم مورّدك إلى المستودع أم نستلم
        نحن. أعطني هذه وأضعها أمام فريقنا.
    source: TO BE CONFIRMED — MIDTRANS operations
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [dangerous goods, restricted commodity, a request for a rate or transit time]
    never_say: [rate, transit time, sailing date, capacity]

  - id: kb-002
    topic: supplier-direct-delivery
    question:
      en: Can my Alibaba supplier ship directly to your warehouse in China?
      ar: هل يستطيع مورّدي على Alibaba إرسال البضاعة مباشرة إلى مستودعكم في الصين؟
    answer:
      en: >
        This is usually how a first LCL order works: your supplier delivers to the consolidation
        point and we take it from there. What our team needs to set it up: the origin city, the
        supplier's contact for the handover, the number and size of cartons, and the commodity.
        Whether the supplier delivers or we collect from their factory depends on the Incoterm you
        agreed with them — if you are not sure which one that is, say so and our team will work it
        out with you.
      ar: >
        هذه عادةً طريقة عمل أول طلبية جزئية: يسلّم مورّدك إلى نقطة التجميع، ونتولّى نحن ما بعدها.
        ما يحتاجه فريقنا لترتيبها: مدينة المنشأ، وجهة الاتصال لدى المورّد للتسليم، وعدد الكراتين
        وأحجامها، ونوع البضاعة. وهل يسلّم المورّد أم نستلم من مصنعه يعتمد على شرط التسليم الذي
        اتفقت معه عليه — وإن لم تكن متأكداً منه، قل ذلك وفريقنا يرتّبها معك.
    source: TO BE CONFIRMED — MIDTRANS operations
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [supplier dispute, payment terms, a request for a rate]
    never_say: [rate, transit time, customs cost]

  - id: kb-003
    topic: syria-import-first-time
    question:
      en: What documents do I need to import into Syria for the first time?
      ar: ما الوثائق التي أحتاجها للاستيراد إلى سوريا لأول مرة؟
    answer:
      en: >
        DRAFT — MUST BE COMPLETED BY MIDTRANS OPERATIONS. The document set is the single most
        valuable thing MIRA can answer accurately, and it is exactly the thing that must not be
        guessed. This entry stays unserved until operations writes the actual list, states who
        issues each document, and says which ones vary by commodity.
      ar: >
        مسوّدة — يجب أن يكملها فريق عمليات ميدترانس. قائمة الوثائق هي أثمن ما تستطيع MIRA الإجابة
        عنه بدقة، وهي بالضبط ما لا يجوز تخمينه. يبقى هذا المُدخَل غير مُقدَّم حتى يكتب الفريق
        القائمة الفعلية، ويحدّد الجهة المُصدِرة لكل وثيقة، وأيّها يختلف باختلاف البضاعة.
    source: REQUIRED — MIDTRANS operations knowledge capture (Phase 04 / D4)
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [any specific shipment, any compliance question]
