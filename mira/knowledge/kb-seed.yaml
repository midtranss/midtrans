  - id: kb-011
    topic: uae-consolidation
    question:
      en: Can you receive goods from several suppliers in Jebel Ali and ship them to Syria as one consignment?
      ar: هل تستقبلون بضاعة من عدّة موردين في جبل علي وتشحنونها إلى سوريا كشحنة واحدة؟
    answer:
      en: >
        Consolidation means your purchases from different suppliers are delivered to one warehouse,
        checked and combined, then move onward as a single shipment under one set of documents.
        It is the normal way a first order from several suppliers is handled, because shipping each
        one separately multiplies the paperwork rather than the cargo. What our team needs to work
        it out: how many suppliers and where they are, roughly how many cartons or pallets in total,
        the gross weight if you have it, and who the consignee will be. The number of collections
        matters more than the volume, so the supplier count is the first thing to tell us.
      ar: >
        التجميع يعني أن مشترياتك من موردين مختلفين تُسلَّم إلى مستودع واحد، تُفحص وتُضمّ، ثم تتحرّك
        كشحنة واحدة بمجموعة وثائق واحدة. وهذه الطريقة المعتادة في أول طلبية من عدّة موردين، لأن
        شحن كلٍّ على حدة يضاعف الأوراق لا البضاعة. ما يحتاجه فريقنا: كم مورّداً وأين، وكم كرتونة
        أو طبلية تقريباً، والوزن الإجمالي إن توفّر، ومن سيكون المرسَل إليه. وعدد عمليات الاستلام
        أهمّ من الحجم، فابدأ بعدد الموردين.
    source: Enquiry 2026-09-15-fmcg-jebelali. Process description only — MIDTRANS operations must confirm the service is offered on this lane and correct the detail.
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [a request for charges, a request for transit time, food or regulated commodities, any specific shipment]
    never_say: [warehouse charges, consolidation charges, transit time, that consolidation is available for a specific commodity]

  - id: kb-012
    topic: heat-sensitive-cargo
    question:
      en: I am importing chocolate and gummies. Does the heat matter?
      ar: أستورد شوكولا وحلويات جيلاتينية. هل تؤثّر الحرارة؟
    answer:
      en: >
        Yes, and it is worth deciding before you buy rather than after. Chocolate, gummies and
        jelly soften and deform well below the temperatures a container reaches standing on a
        quay or crossing the Gulf in summer, and the damage is usually cosmetic enough to sell
        badly but not obvious enough to argue about. It changes how the cargo should be packed
        and routed, and whether temperature-controlled equipment is worth considering. Tell our
        team what proportion of the shipment is heat-sensitive and when you plan to ship, and
        they will cover it in the quotation.
      ar: >
        نعم، ويُفضَّل حسمها قبل الشراء لا بعده. الشوكولا والحلويات الجيلاتينية تلين وتتشوّه عند
        حرارات أقلّ بكثير مما تبلغه الحاوية واقفةً على الرصيف أو عابرةً الخليج صيفاً، والضرر عادةً
        شكليٌّ بما يكفي ليُفسد البيع، وغير ظاهر بما يكفي للمطالبة به. وهو يغيّر طريقة التعبئة
        والمسار، وما إذا كانت المعدّات المبرّدة تستحقّ النظر. أخبر فريقنا ما نسبة البضاعة الحسّاسة
        للحرارة ومتى تنوي الشحن، ليغطّيها في العرض.
    source: Enquiry 2026-09-15-fmcg-jebelali — raised by MIDTRANS, not by the customer. Physical property of the commodity; MIDTRANS operations should add what it does about it on this lane.
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [a request for reefer charges, a guarantee about condition on arrival, any specific shipment]
    never_say: [that cargo will arrive undamaged, reefer rates, temperature guarantees, transit time]

  - id: kb-013
    topic: vehicle-shipping-method
    question:
      en: How are vehicles shipped — RoRo or in a container?
      ar: كيف تُشحن المركبات — دحرجة أم داخل حاوية؟
    answer:
      en: >
        Both are used, and what decides between them is the vehicle rather than a preference.
        RoRo means the vehicle is driven on and off the ship, so it must be self-propelled and
        road-legal at loading. Containerised means it is secured inside a container, which suits
        vehicles that do not run, that are being shipped with parts or cargo inside, or where the
        destination has no RoRo service. Dimensions matter for the second: a long wheelbase van can
        exceed what a standard container takes. What our team needs: the make, model and dimensions,
        the gross weight, whether the vehicle is running and road-legal, and the destination port.
      ar: >
        الطريقتان مستخدمتان، والذي يحسم بينهما هو المركبة لا التفضيل. الدحرجة (RoRo) تعني أن
        المركبة تُقاد صعوداً ونزولاً، فيجب أن تكون عاملة وصالحة للسير عند التحميل. والحاوية تعني
        تثبيتها داخلها، وهو مناسب للمركبات غير العاملة، أو المشحونة ومعها قطع أو بضاعة، أو حين لا
        تتوفّر خدمة دحرجة في الوجهة. والأبعاد مهمّة في الثانية: مركبة بقاعدة عجلات طويلة قد تتجاوز
        ما تستوعبه الحاوية القياسية. ما يحتاجه فريقنا: النوع والطراز والأبعاد، والوزن الإجمالي،
        وهل المركبة عاملة وصالحة للسير، ومرفأ الوجهة.
    source: Enquiry 2026-09-16-sprinters. Method description only. Whether MIDTRANS books RoRo on a given lane is an operations question — see kb-006.
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
