  - id: kb-015
    topic: turkey-transit
    question:
      en: Can cargo move through Turkey under customs transit without being imported into Turkey?
      ar: هل يمكن أن تمرّ البضاعة عبر تركيا بنظام العبور الجمركي دون استيرادها إلى تركيا؟
    answer:
      en: >
        DRAFT — MUST BE COMPLETED BY MIDTRANS OPERATIONS. Two separate questions sit inside this
        one: whether the transit arrangement exists as described, and whether MIDTRANS operates it.
        The first is a customs matter and the second is a capability question, and neither may be
        answered from general knowledge. This entry stays unserved until operations answers both,
        because a shipper who plans a route on a guessed answer discovers the error at a border.
      ar: >
        مسوّدة — يجب أن يكملها فريق عمليات ميدترانس. في هذا السؤال سؤالان: هل ترتيب العبور موجود
        بالصيغة الموصوفة، وهل تشغّله ميدترانس. الأول شأن جمركي والثاني شأن قدرة، ولا يجوز الإجابة
        عن أيٍّ منهما من معرفة عامة. يبقى هذا المُدخَل غير مُقدَّم حتى يجيب الفريق عنهما، لأن
        الشاحن الذي يخطّط مساراً على جواب مُخمَّن يكتشف الخطأ عند الحدود.
    source: REQUIRED — MIDTRANS operations knowledge capture. Asked in enquiry 2026-09-12-usa-syria, which went to five forwarders simultaneously.
