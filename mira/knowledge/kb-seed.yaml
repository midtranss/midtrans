    never_say: [that a transit route is available, that a country permits something, transit time, rates]

  - id: kb-016
    topic: branded-goods
    question:
      en: I am importing clothing and footwear from China. Do brand marks cause a problem at clearance?
      ar: أستورد ألبسة وأحذية من الصين. هل تسبّب العلامات التجارية مشكلة عند التخليص؟
    answer:
      en: >
        DRAFT — MUST BE COMPLETED BY MIDTRANS OPERATIONS. Branded and brand-resembling goods are
        the category where a consignment is most often held, and what happens depends on the mark,
        the destination and the documentation the importer holds. MIRA must not tell a customer
        their goods will clear, and must not tell them they will not. What this entry should
        contain, once operations writes it: what MIDTRANS asks for before shipping in this
        category, and what it has seen go wrong. Until then MIRA raises the question and routes it.
      ar: >
        مسوّدة — يجب أن يكملها فريق عمليات ميدترانس. البضائع التي تحمل علامات تجارية أو ما يشبهها
        هي الفئة الأكثر تعرّضاً للحجز، وما يحدث يعتمد على العلامة والوجهة والوثائق التي يملكها
        المستورد. لا يجوز أن تخبر MIRA العميل أن بضاعته ستُخلَّص، ولا أنها لن تُخلَّص. ما يجب أن
        يحويه هذا المُدخَل حين يكتبه الفريق: ما تطلبه ميدترانس قبل الشحن في هذه الفئة، وما رأته
        يقع من أخطاء. وحتى ذلك الحين تثير MIRA السؤال وتحيله.
    source: REQUIRED — MIDTRANS operations knowledge capture. Asked in enquiries 2026-09-13-lcl-china and 2026-09-12-usa-syria within four days of each other.
