  - id: kb-004
    topic: chemicals-dg
    question:
      en: Do you ship chemicals, and what do you need from me?
      ar: هل تشحنون المواد الكيميائية، وماذا تحتاجون منّي؟
    answer:
      en: >
        Chemical shipments are handled case by case, and whether a specific cargo can move depends
        on its classification and the carrier's current acceptance policy — that is an operational
        decision, not one I can confirm. What our team needs to assess it: the safety data sheet
        (MSDS) from your supplier, the UN number and class if you have them, the net and gross
        weight, the packaging type, and the origin and destination. Send me the MSDS and I will
        route it straight to the team.
      ar: >
        شحنات المواد الكيميائية تُدرَس حالة بحالة، وإمكانية نقل بضاعة بعينها تعتمد على تصنيفها
        وسياسة القبول الحالية لدى الناقل — وهذا قرار تشغيلي لا أستطيع تأكيده. ما يحتاجه فريقنا
        لتقييمها: صحيفة بيانات السلامة (MSDS) من مورّدك، ورقم الأمم المتحدة والفئة إن توفّرا،
        والوزن الصافي والإجمالي، ونوع التعبئة، والمنشأ والوجهة. أرسل لي الـ MSDS وأحوّلها للفريق
        مباشرة.
    source: Observed enquiry pattern; DG requirements are standard carrier practice
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [always — every DG enquiry routes to a human]
    never_say: [that a cargo is or is not dangerous, acceptance, rate, transit time]

  - id: kb-005
    topic: incoterms
    question:
      en: What is DDP versus DDU, and which do I need?
      ar: ما الفرق بين DDP و DDU، وأيّهما أحتاج؟
    answer:
      en: >
        Under DDP the seller delivers to your door with import duties and taxes paid. Under DDU
        (now DAP) the seller delivers to your door but you pay the import duties and taxes. Which
        suits you depends on what you agreed with your supplier and whether you want to handle
        import charges yourself. I cannot tell you what those charges will be — that depends on
        the classification and current regulations, and our customs team handles it. If you tell
        me what your supplier quoted, our team can tell you what it does and does not include.
      ar: >
        في DDP يسلّم البائع إلى بابك ورسوم الاستيراد والضرائب مدفوعة. وفي DDU (وتُسمّى الآن DAP)
        يسلّم إلى بابك لكنك تدفع رسوم الاستيراد والضرائب. وأيّهما يناسبك يعتمد على ما اتفقت عليه
        مع مورّدك وهل تريد تولّي رسوم الاستيراد بنفسك. ولا أستطيع إخبارك بقيمة تلك الرسوم — فهي
        تعتمد على التصنيف واللوائح السارية، وفريق التخليص لدينا يتولّاها. إن أخبرتني بما عرضه
        مورّدك، يستطيع فريقنا أن يبيّن لك ما يشمله وما لا يشمله.
    source: Standard Incoterms 2020 definitions
    owner: null
    reviewed_at: null
    expires_at: null
    status: draft
    escalate_if: [a request for the duty amount, a specific shipment calculation]
    never_say: [duty rate, tax amount, clearance cost, total landed cost]

