<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="theme/tokens.css"><link rel="stylesheet" href="theme/midtrans.css"></head><body><style>
  body { margin: 0; padding: 24px; background: var(--surface-sunken); min-height: 250px; }
  .stage { position: relative; height: 250px; border: 1px dashed var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-page); }
  .stage .mt-rail { position: absolute; inset-block-start: 50%; inset-inline-end: 16px; }
  .stage .mt-launcher { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; }
  .ph { display: grid; place-items: center; font-size: 8px; color: var(--ink-muted); background: var(--surface-sunken); }
  .note { margin: 0 0 12px; font: var(--text-body-sm); color: var(--ink-muted); font-family: var(--font-sans); }
</style>
<p class="note">Four rail buttons in the site's own order — search, documents, assistant, offices — with the assistant's filled.</p>
<div class="stage">
  <nav class="mt-rail" aria-label="Quick actions">
    <a class="mt-rail__item" href="#" aria-label="Track a shipment"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 5.2 5.2M10.5 7.8v5.4M7.8 10.5h5.4"/></svg></a>
    <a class="mt-rail__item" href="#" aria-label="Request a quotation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3H13l5 5v13H6.5z"/><path d="M13 3v5h5"/><path d="M9.5 13h5M9.5 16.5h5"/></svg></a>
    <a class="mt-rail__item mt-rail__item--accent" href="#" aria-label="Chat with Mira, MIDTRANS logistics assistant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5 5 16.4A8.2 8.2 0 1 1 8.2 19.4L3.5 20.5Z"/><circle cx="12" cy="11.5" r="4.2"/><path d="M12 7.3v8.4M7.8 11.5h8.4"/></svg></a>
    <a class="mt-rail__item" href="#" aria-label="Our offices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg></a>
  </nav>
  <a class="mt-launcher" href="#">
    <span class="mt-launcher__avatar ph">photo</span>
    <span class="mt-launcher__text">
      <span class="mt-launcher__name">Mira</span>
      <span class="mt-launcher__role">MIDTRANS logistics assistant</span>
    </span>
  </a>
</div>
</body></html>
